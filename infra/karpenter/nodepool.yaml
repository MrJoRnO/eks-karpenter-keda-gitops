apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ng-spot
spec:
  template:
    metadata:
      labels:
        node-pool: ng-spot

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ng-spot

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # Allow a range of instance families so Spot capacity is available
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]

      # Taint keeps non-job workloads off these nodes
      taints:
        - key: workload
          value: spot
          effect: NoSchedule

  limits:
    cpu: 100
    memory: 200Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
