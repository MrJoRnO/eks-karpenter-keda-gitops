apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ng-spot
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  # Patched per-environment in overlays/
  instanceProfile: "REPLACE_WITH_ENV_NODE_PROFILE"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "REPLACE_WITH_CLUSTER_NAME"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "REPLACE_WITH_CLUSTER_NAME"
  tags:
    karpenter.sh/discovery: "REPLACE_WITH_CLUSTER_NAME"
    NodePool: ng-spot
