apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sqs-processor

resources:
- ../../base

patches:
- path: queue-url-patch.yaml

# CD pipeline updates newTag on every successful build of the main branch.
# Format: main-<short-git-sha>  e.g. main-a1b2c3d4
images:
- name: platform/sqs-to-s3-job
  newName: 194636597980.dkr.ecr.eu-central-1.amazonaws.com/platform/sqs-to-s3-job
  newTag: main-b18c8eea
